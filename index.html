<title>Bourbon Advent</title>
<meta name="description" content="Our yearly bourbon advent calendar: what we poured, day by day.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥃</text></svg>">
<style>
  :root { --bg:#f6f8fb; --surface:#fff; --surface-2:#eef2f7; --ink:#1f2937; --muted:#667085; --line:#e2e8f0;
          --accent:#f5a524; --accent-ink:#1f2937; --accent-text:#b45309; --accent-soft:#fff3d9; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .years { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .years button { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 16px;
                  cursor:pointer; font:inherit; font-weight:700; color:var(--ink); }
  .years button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .meta { color:var(--muted); font-size:14px; margin: 0 0 10px; }
  .list { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .band { display:flex; gap:12px; align-items:baseline; padding:9px 14px; background:var(--accent-soft); border-top:1px solid var(--line); }
  .band:first-child { border-top:0; }
  .band .t { font-weight:800; color:var(--accent-text); font-size:12px; text-transform:uppercase; letter-spacing:.6px; white-space:nowrap; }
  .band .n { font-weight:700; }
  .row { display:grid; grid-template-columns: 34px 1fr auto; gap:10px; align-items:baseline; padding:9px 14px; border-top:1px solid var(--line); }
  .day { color:var(--muted); font-variant-numeric: tabular-nums; }
  .drink { font-weight:600; overflow-wrap:anywhere; }
  .by { color:var(--muted); }
  .pending .drink { color:var(--muted); font-weight:400; font-style:italic; }
  footer { margin-top:20px; color:var(--muted); font-size:13px; text-align:center; }
  @media (max-width: 480px) { h1 { font-size: 22px; } .row { grid-template-columns: 28px 1fr; } .by { grid-column: 2; margin-top:-6px; font-size:14px; } }
</style>
</head>
<body>

  <div class="list" id="list"></div>
  <footer>Updated as we go. Come back tomorrow.</footer>
